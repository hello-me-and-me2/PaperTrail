<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="5" fill="#0d1424"/>

  <!-- Steps -->
  <rect x="3"  y="28.5" width="26" height="2"   rx="0.5" fill="#172554"/>
  <rect x="5"  y="26.5" width="22" height="2"   rx="0.5" fill="#1e3a8a"/>
  <rect x="7"  y="24.5" width="18" height="2"   rx="0.5" fill="#1e40af"/>

  <!-- Left wing -->
  <rect x="2"  y="17"   width="9"  height="7.5" rx="0.5" fill="#1d4ed8"/>
  <rect x="2"  y="16"   width="9"  height="1.5" rx="0.5" fill="#3b82f6"/>

  <!-- Right wing -->
  <rect x="21" y="17"   width="9"  height="7.5" rx="0.5" fill="#1d4ed8"/>
  <rect x="21" y="16"   width="9"  height="1.5" rx="0.5" fill="#3b82f6"/>

  <!-- Center building -->
  <rect x="10" y="15"   width="12" height="9.5" fill="#2563eb"/>
  <rect x="10" y="14"   width="12" height="1.5" fill="#60a5fa"/>

  <!-- Columns on center -->
  <rect x="11" y="15" width="0.8" height="9.5" fill="#93c5fd" opacity="0.35"/>
  <rect x="13.2" y="15" width="0.8" height="9.5" fill="#93c5fd" opacity="0.35"/>
  <rect x="15.4" y="15" width="0.8" height="9.5" fill="#93c5fd" opacity="0.35"/>
  <rect x="17.6" y="15" width="0.8" height="9.5" fill="#93c5fd" opacity="0.35"/>
  <rect x="19.8" y="15" width="0.8" height="9.5" fill="#93c5fd" opacity="0.35"/>

  <!-- Dome drum -->
  <rect x="13" y="9.5"  width="6"  height="5"   fill="#3b82f6"/>

  <!-- Dome -->
  <path d="M11 9.5 Q16 1.5 21 9.5 Z" fill="#60a5fa"/>
  <!-- Dome highlight -->
  <path d="M13.5 9.5 Q16 3.5 18.5 9.5 Z" fill="#bfdbfe" opacity="0.4"/>

  <!-- Lantern -->
  <rect x="15.2" y="1.5" width="1.6" height="3" rx="0.4" fill="#dbeafe"/>

  <!-- Wing windows -->
  <rect x="4"  y="19.5" width="2" height="2" rx="0.3" fill="#172554" opacity="0.8"/>
  <rect x="7"  y="19.5" width="2" height="2" rx="0.3" fill="#172554" opacity="0.8"/>
  <rect x="23" y="19.5" width="2" height="2" rx="0.3" fill="#172554" opacity="0.8"/>
  <rect x="26" y="19.5" width="2" height="2" rx="0.3" fill="#172554" opacity="0.8"/>
</svg>
